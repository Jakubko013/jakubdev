name: Fakturace — instalátor pro Windows

# Instalátor .exe se musí sestavit na Windows: NSIS i vkládání ikony
# do spustitelného souboru jinde nefungují. Běh se spustí sám při změně
# ve složce fakturace/ a dá se kdykoli spustit i ručně přes záložku Actions.
on:
  push:
    branches:
      - claude/invoicing-accounting-app-1e9bgg
    paths:
      - "fakturace/**"
      - ".github/workflows/fakturace-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fakturace

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fakturace/package-lock.json

      - name: Instalace závislostí
        run: npm ci

      - name: Testy výpočtů
        run: npm test

      - name: Sestavení instalátoru
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Instalátor ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: Fakturace-Windows
          path: |
            fakturace/dist/*.exe
          if-no-files-found: error
          retention-days: 90
